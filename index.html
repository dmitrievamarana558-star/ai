<html lang="ru">

<head>

<meta charset="UTF-8">

<title>Моя игра</title>

<style>

body {
    margin: 0;
    overflow: hidden;
    background: #080b12;
    font-family: Arial;
    color: white;
}

canvas {
    display: block;
    margin: auto;

}

<body>

<div id="info">
    🎮 Управление: WASD / стрелки
    <br>
    ⭐ Очки: <span id="score">0</span>
</div>

<canvas id="game" width="800" height="500"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");

let score = 0;

const player = {
    x: 380,
    y: 230,
    size: 35,
    speed: 5
};

const keys = {};

document.addEventListener("keydown", function(e) {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", function(e) {
    keys[e.key.toLowerCase()] = false;
});

let coins = [];

for (let i = 0; i < 10; i++) {

    coins.push({
        x: Math.random() * 760 + 20,
        y: Math.random() * 460 + 20,
        size: 12
    });

}


function update() {

    if (
        keys["arrowup"] ||
        keys["w"]
    ) {
        player.y -= player.speed;
    }

    if (
        keys["arrowdown"] ||
        keys["s"]
    ) {
        player.y += player.speed;
    }

    if (
        keys["arrowleft"] ||
        keys["a"]
    ) {
        player.x -= player.speed;
    }

    if (
        keys["arrowright"] ||
        keys["d"]
    ) {
        player.x += player.speed;
    }

    player.x = Math.max(
        0,
        Math.min(
            canvas.width - player.size,
            player.x
        )
    );

    player.y = Math.max(
        0,
        Math.min(
            canvas.height - player.size,
            player.y
        )
    );


    coins.forEach((coin, index) => {

        const distance = Math.hypot(
            player.x - coin.x,
            player.y - coin.y
        );

        if (distance < 30) {

            coins.splice(index, 1);

            score++;

            scoreElement.textContent = score;

            coins.push({
                x: Math.random() * 760 + 20,
                y: Math.random() * 460 + 20,
                size: 12
            });

        }

    });

}


function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Игрок

    ctx.fillStyle = "#6c5ce7";

    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );


    // Монеты

    coins.forEach(coin => {

        ctx.beginPath();

        ctx.arc(
            coin.x,
            coin.y,
            coin.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#ffd32a";

        ctx.fill();

    });

}


function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);

}

gameLoop();

</script>
